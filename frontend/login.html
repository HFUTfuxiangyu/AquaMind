<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | AquaMind 智慧水务</title>
    <link rel="stylesheet" href="assets/css/system-fonts.css">
    <link rel="stylesheet" href="assets/css/font-awesome.min.css">
    <script src="components/auth.js"></script>
    <style>
        :root {
            --primary: #0b91a4;
            --primary-dark: #087486;
            --green: #18a87e;
            --ink: #142c38;
            --muted: #6d818d;
            --border: #dce8ec;
            --danger: #d94b4b;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 0;
            overflow: hidden;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 15%, rgba(24, 168, 126, .17), transparent 28%),
                radial-gradient(circle at 90% 82%, rgba(11, 145, 164, .18), transparent 31%),
                linear-gradient(135deg, #eef9f7 0%, #f4fafc 48%, #e8f6fa 100%);
            background-size: 140% 140%;
            animation: pageGradient 16s ease-in-out infinite alternate;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        }
        .auth-shell {
            width: 100vw;
            height: 100vh;
            min-height: 560px;
            display: grid;
            grid-template-columns: 1.08fr .92fr;
            overflow: hidden;
            border: 0;
            border-radius: 0;
            background: rgba(255, 255, 255, .96);
            box-shadow: none;
        }
        .brand-panel {
            position: relative;
            overflow: hidden;
            padding: clamp(38px, 5vw, 78px);
            color: #fff;
            background: linear-gradient(145deg, #087f93 0%, #0b99a4 42%, #18a87e 74%, #087f93 100%);
            background-size: 220% 220%;
            animation: waterGradient 14s ease-in-out infinite;
        }
        .brand-panel::before,
        .brand-panel::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 50%;
        }
        .brand-panel::before { width: 46vw; height: 46vw; right: -27vw; top: -19vw; animation: rippleDrift 18s ease-in-out infinite alternate; }
        .brand-panel::after { width: 31vw; height: 31vw; left: -18vw; bottom: -19vw; animation: rippleDrift 14s ease-in-out infinite alternate-reverse; }
        .brand-mark { position: relative; z-index: 3; display: flex; align-items: center; gap: 13px; font-size: 22px; font-weight: 700; }
        .brand-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; background: rgba(255, 255, 255, .18); }
        .brand-copy { position: relative; z-index: 3; margin-top: clamp(72px, 13vh, 140px); }
        .brand-copy h1 { margin: 0 0 18px; max-width: 390px; font-size: clamp(32px, 4vw, 48px); line-height: 1.18; letter-spacing: 1px; }
        .brand-copy p { max-width: 410px; margin: 0; color: rgba(255, 255, 255, .82); font-size: 16px; line-height: 1.85; }
        .feature-list { position: relative; z-index: 3; display: grid; gap: 16px; margin-top: clamp(36px, 7vh, 68px); }
        .feature { display: flex; align-items: center; gap: 11px; color: rgba(255, 255, 255, .92); font-size: 14px; }
        .feature i { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, .17); font-size: 11px; }
        .form-panel { position: relative; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 48px clamp(42px, 7vw, 120px); background: rgba(255, 255, 255, .94); }
        .form-panel::before { content: ""; position: absolute; width: 330px; height: 330px; right: -180px; bottom: -180px; border-radius: 50%; background: radial-gradient(circle, rgba(11, 145, 164, .09), transparent 68%); animation: softPulse 8s ease-in-out infinite; pointer-events: none; }
        .form-box { position: relative; z-index: 2; width: min(100%, 520px); }
        .water-motion { position: absolute; z-index: 1; inset: 0; overflow: hidden; pointer-events: none; }
        .water-wave { position: absolute; width: 130%; height: 260px; left: -15%; bottom: -205px; border-radius: 46% 52% 0 0; background: rgba(255, 255, 255, .075); animation: waveFloat 9s ease-in-out infinite alternate; }
        .water-wave.wave-two { bottom: -225px; left: -5%; background: rgba(255, 255, 255, .055); animation-duration: 12s; animation-direction: alternate-reverse; }
        .water-bubble { position: absolute; bottom: -70px; width: var(--size); height: var(--size); left: var(--left); border: 1px solid rgba(255, 255, 255, .26); border-radius: 50%; background: rgba(255, 255, 255, .055); box-shadow: inset 2px 2px 6px rgba(255, 255, 255, .08); animation: bubbleRise var(--duration) linear var(--delay) infinite; }
        .water-bubble::after { content: ""; position: absolute; width: 22%; height: 22%; top: 18%; left: 22%; border-radius: 50%; background: rgba(255, 255, 255, .33); }
        @keyframes pageGradient { to { background-position: 100% 70%; } }
        @keyframes waterGradient { 0%, 100% { background-position: 0% 45%; } 50% { background-position: 100% 58%; } }
        @keyframes rippleDrift { to { transform: translate3d(-34px, 28px, 0) scale(1.08); opacity: .78; } }
        @keyframes waveFloat { to { transform: translate3d(4%, -25px, 0) rotate(-2deg); } }
        @keyframes bubbleRise {
            0% { transform: translate3d(0, 0, 0) scale(.72); opacity: 0; }
            10% { opacity: .75; }
            50% { transform: translate3d(22px, -52vh, 0) scale(.92); }
            100% { transform: translate3d(-14px, -112vh, 0) scale(1.08); opacity: 0; }
        }
        @keyframes softPulse { 50% { transform: scale(1.14); opacity: .6; } }
        .form-heading { margin-bottom: 29px; }
        .form-heading h2 { margin: 0 0 9px; font-size: 28px; }
        .form-heading p { margin: 0; color: var(--muted); font-size: 14px; }
        .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; margin-bottom: 28px; border-radius: 12px; background: #edf4f6; }
        .auth-tab { height: 42px; border: 0; border-radius: 9px; background: transparent; color: #6b7e88; font: inherit; font-weight: 600; cursor: pointer; }
        .auth-tab.active { color: var(--primary); background: #fff; box-shadow: 0 3px 11px rgba(42, 85, 98, .1); }
        .field { margin-bottom: 18px; }
        .field label { display: block; margin-bottom: 8px; color: #38505c; font-size: 13px; font-weight: 600; }
        .input-wrap { position: relative; }
        .input-wrap > i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #8ba0aa; }
        .input-wrap input {
            width: 100%; height: 50px; padding: 0 45px 0 43px; border: 1px solid var(--border); border-radius: 11px; outline: 0; color: var(--ink); background: #fbfdfe; font: inherit; transition: .2s ease;
        }
        .input-wrap input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(11, 145, 164, .1); }
        .password-toggle { position: absolute; right: 7px; top: 7px; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #8297a1; cursor: pointer; }
        .password-toggle:hover { color: var(--primary); background: #eef8f9; }
        .form-options { display: flex; justify-content: space-between; align-items: center; min-height: 28px; margin: -2px 0 18px; color: var(--muted); font-size: 13px; }
        .remember { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
        .remember input { width: 16px; height: 16px; accent-color: var(--primary); }
        .password-rule { color: #8a9aa2; }
        .form-message { display: none; margin: 0 0 15px; padding: 10px 12px; border-radius: 9px; font-size: 13px; line-height: 1.45; }
        .form-message.error { display: block; color: #b83d3d; background: #fff1f1; border: 1px solid #ffd8d8; }
        .form-message.success { display: block; color: #14775c; background: #eafaf4; border: 1px solid #c9efe1; }
        .submit-button { width: 100%; height: 50px; border: 0; border-radius: 11px; color: #fff; background: linear-gradient(100deg, var(--primary), var(--green)); font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(11, 145, 164, .18); transition: transform .18s ease, box-shadow .18s ease; }
        .submit-button:hover { transform: translateY(-1px); box-shadow: 0 13px 24px rgba(11, 145, 164, .23); }
        .submit-button:disabled { cursor: wait; opacity: .7; transform: none; }
        .local-note { display: flex; gap: 8px; align-items: flex-start; margin: 20px 0 0; color: #8a9aa2; font-size: 12px; line-height: 1.55; }
        .local-note i { margin-top: 2px; color: var(--primary); }
        @media (max-width: 820px) {
            body { overflow-y: auto; }
            .auth-shell { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
            .brand-panel { padding: 30px; }
            .brand-copy { margin-top: 50px; }
            .brand-copy h1 { font-size: 32px; }
            .feature-list { display: none; }
            .form-panel { padding: 38px 30px 42px; }
        }
        @media (max-width: 460px) {
            .auth-shell { min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
            .brand-panel { padding: 23px; }
            .brand-copy { margin-top: 30px; }
            .brand-copy p { display: none; }
            .form-panel { align-items: flex-start; padding: 32px 23px; }
        }
        @media (prefers-reduced-motion: reduce) {
            body, .brand-panel, .brand-panel::before, .brand-panel::after, .form-panel::before, .water-wave, .water-bubble { animation: none !important; }
        }
    </style>
</head>
<body>
    <main class="auth-shell">
        <section class="brand-panel" aria-label="AquaMind 系统介绍">
            <div class="water-motion" aria-hidden="true">
                <span class="water-wave"></span>
                <span class="water-wave wave-two"></span>
                <span class="water-bubble" style="--left:8%;--size:18px;--duration:13s;--delay:-2s"></span>
                <span class="water-bubble" style="--left:21%;--size:34px;--duration:17s;--delay:-9s"></span>
                <span class="water-bubble" style="--left:38%;--size:13px;--duration:11s;--delay:-5s"></span>
                <span class="water-bubble" style="--left:55%;--size:26px;--duration:15s;--delay:-12s"></span>
                <span class="water-bubble" style="--left:72%;--size:16px;--duration:12s;--delay:-7s"></span>
                <span class="water-bubble" style="--left:87%;--size:38px;--duration:18s;--delay:-4s"></span>
            </div>
            <div class="brand-mark"><span class="brand-icon"><i class="fas fa-droplet"></i></span>AquaMind 智慧水务</div>
            <div class="brand-copy">
                <h1>让每一滴水<br>都被智慧守护</h1>
                <p>统一查看水质、设备与能效状态，基于真实运行数据辅助分析和决策。</p>
            </div>
            <div class="feature-list">
                <div class="feature"><i class="fas fa-check"></i><span>实时水质监测与异常预警</span></div>
                <div class="feature"><i class="fas fa-check"></i><span>AI 加药优化与设备健康分析</span></div>
                <div class="feature"><i class="fas fa-check"></i><span>能效调度与数据洞察</span></div>
            </div>
        </section>

        <section class="form-panel">
            <div class="form-box">
                <div class="form-heading">
                    <h2 id="formTitle">欢迎回来</h2>
                    <p id="formSubtitle">登录后进入智慧水务管理系统</p>
                </div>
                <div class="auth-tabs" role="tablist" aria-label="账户操作">
                    <button class="auth-tab active" id="loginTab" type="button" role="tab" aria-selected="true">登录</button>
                    <button class="auth-tab" id="registerTab" type="button" role="tab" aria-selected="false">注册</button>
                </div>
                <form id="authForm" novalidate>
                    <div class="field">
                        <label for="username">用户名</label>
                        <div class="input-wrap">
                            <i class="far fa-user"></i>
                            <input id="username" name="username" type="text" minlength="2" maxlength="20" autocomplete="username" placeholder="请输入用户名" required>
                        </div>
                    </div>
                    <div class="field">
                        <label for="password">密码</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input id="password" name="password" type="password" minlength="6" maxlength="64" autocomplete="current-password" placeholder="请输入密码" required>
                            <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码"><i class="far fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember"><input id="remember" type="checkbox">保持登录</label>
                        <span class="password-rule" id="passwordRule">请输入账户密码</span>
                    </div>
                    <div class="form-message" id="formMessage" role="alert"></div>
                    <button class="submit-button" id="submitButton" type="submit">登录系统</button>
                </form>
                <p class="local-note"><i class="fas fa-shield-halved"></i><span>账户保存在当前设备，密码仅保存加盐摘要，不保存明文。</span></p>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const form = document.getElementById('authForm');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const remember = document.getElementById('remember');
            const submitButton = document.getElementById('submitButton');
            const message = document.getElementById('formMessage');
            const title = document.getElementById('formTitle');
            const subtitle = document.getElementById('formSubtitle');
            const passwordRule = document.getElementById('passwordRule');
            const passwordToggle = document.getElementById('passwordToggle');
            let mode = 'login';

            function setMode(nextMode) {
                mode = nextMode;
                const registering = mode === 'register';
                loginTab.classList.toggle('active', !registering);
                registerTab.classList.toggle('active', registering);
                loginTab.setAttribute('aria-selected', String(!registering));
                registerTab.setAttribute('aria-selected', String(registering));
                title.textContent = registering ? '创建账户' : '欢迎回来';
                subtitle.textContent = registering ? '设置用户名和密码即可开始使用' : '登录后进入智慧水务管理系统';
                submitButton.textContent = registering ? '注册并进入系统' : '登录系统';
                passwordRule.textContent = registering ? '密码至少 6 个字符' : '请输入账户密码';
                password.autocomplete = registering ? 'new-password' : 'current-password';
                message.className = 'form-message';
                message.textContent = '';
            }

            function showMessage(text, kind) {
                message.textContent = text;
                message.className = `form-message ${kind}`;
            }

            function nextPage() {
                const requested = new URLSearchParams(window.location.search).get('next') || '';
                return window.AquaMindAuth.safeNextPage(requested);
            }

            loginTab.addEventListener('click', () => setMode('login'));
            registerTab.addEventListener('click', () => setMode('register'));
            passwordToggle.addEventListener('click', () => {
                const visible = password.type === 'text';
                password.type = visible ? 'password' : 'text';
                passwordToggle.innerHTML = visible ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
                passwordToggle.setAttribute('aria-label', visible ? '显示密码' : '隐藏密码');
            });

            form.addEventListener('submit', async event => {
                event.preventDefault();
                if (!username.value.trim() || !password.value) {
                    showMessage('请输入用户名和密码', 'error');
                    return;
                }
                submitButton.disabled = true;
                submitButton.textContent = mode === 'register' ? '正在注册…' : '正在登录…';
                try {
                    if (mode === 'register') {
                        await window.AquaMindAuth.register(username.value, password.value, remember.checked);
                        showMessage('注册成功，正在进入系统…', 'success');
                    } else {
                        await window.AquaMindAuth.login(username.value, password.value, remember.checked);
                        showMessage('登录成功，正在进入系统…', 'success');
                    }
                    window.setTimeout(() => window.location.replace(nextPage()), 450);
                } catch (error) {
                    showMessage(error.message || '操作失败，请重试', 'error');
                    submitButton.disabled = false;
                    submitButton.textContent = mode === 'register' ? '注册并进入系统' : '登录系统';
                }
            });

            if (!window.AquaMindAuth.hasUsers()) setMode('register');
            else setMode('login');
            window.setTimeout(() => username.focus(), 0);
        })();
    </script>
</body>
</html>
