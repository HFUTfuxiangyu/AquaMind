<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="水厂工艺流程示意图">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f8ef"/>
      <stop offset="0.48" stop-color="#d5f0f7"/>
      <stop offset="1" stop-color="#e8f4f8"/>
    </linearGradient>
    <linearGradient id="river" x1="0" x2="1">
      <stop offset="0" stop-color="#a8d4f2"/>
      <stop offset="0.52" stop-color="#83d3e2"/>
      <stop offset="1" stop-color="#b8e8df"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f8b9e" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7fb5cb"/>
    </marker>
  </defs>

  <rect width="1600" height="520" rx="14" fill="url(#bg)"/>

  <path d="M 74 246 C 260 206, 440 286, 620 246 S 970 205, 1165 246 S 1420 300, 1530 246"
        fill="none" stroke="url(#river)" stroke-width="74" stroke-linecap="round" opacity="0.82"/>
  <text x="800" y="258" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" opacity="0.92">河流流向 →</text>

  <g fill="none" stroke="#7fb5cb" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)" opacity="0.8">
    <path d="M 170 150 C 260 115, 330 115, 420 150"/>
    <path d="M 430 345 C 520 380, 610 380, 700 345"/>
    <path d="M 690 150 C 790 115, 870 115, 970 150"/>
    <path d="M 945 345 C 1040 380, 1130 380, 1220 345"/>
    <path d="M 1210 150 C 1320 115, 1420 125, 1500 190"/>
  </g>

  <g filter="url(#softShadow)" font-family="Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(90 112)">
      <rect width="190" height="72" rx="16" fill="#ffffff" stroke="#d6e4ef" stroke-width="2"/>
      <circle cx="36" cy="36" r="18" fill="#eaf5ff"/>
      <text x="70" y="31" font-size="19" font-weight="700" fill="#0f172a">取水口</text>
      <text x="70" y="55" font-size="13" fill="#64748b">原水进入</text>
    </g>
    <g transform="translate(350 306)">
      <rect width="190" height="72" rx="16" fill="#ffffff" stroke="#d6e4ef" stroke-width="2"/>
      <circle cx="36" cy="36" r="18" fill="#e8fbf8"/>
      <text x="70" y="31" font-size="19" font-weight="700" fill="#0f172a">混凝池</text>
      <text x="70" y="55" font-size="13" fill="#64748b">加药混凝</text>
    </g>
    <g transform="translate(610 112)">
      <rect width="190" height="72" rx="16" fill="#ffffff" stroke="#d6e4ef" stroke-width="2"/>
      <circle cx="36" cy="36" r="18" fill="#e8fbf8"/>
      <text x="70" y="31" font-size="19" font-weight="700" fill="#0f172a">沉淀池</text>
      <text x="70" y="55" font-size="13" fill="#64748b">泥水分离</text>
    </g>
    <g transform="translate(870 306)">
      <rect width="190" height="72" rx="16" fill="#ffffff" stroke="#d6e4ef" stroke-width="2"/>
      <circle cx="36" cy="36" r="18" fill="#e8fbf8"/>
      <text x="70" y="31" font-size="19" font-weight="700" fill="#0f172a">滤池</text>
      <text x="70" y="55" font-size="13" fill="#64748b">过滤净化</text>
    </g>
    <g transform="translate(1130 112)">
      <rect width="190" height="72" rx="16" fill="#ffffff" stroke="#d6e4ef" stroke-width="2"/>
      <circle cx="36" cy="36" r="18" fill="#e8fbf8"/>
      <text x="70" y="31" font-size="19" font-weight="700" fill="#0f172a">消毒间</text>
      <text x="70" y="55" font-size="13" fill="#64748b">加氯消毒</text>
    </g>
    <g transform="translate(1370 306)">
      <rect width="190" height="72" rx="16" fill="#ffffff" stroke="#d6e4ef" stroke-width="2"/>
      <circle cx="36" cy="36" r="18" fill="#e8fbf8"/>
      <text x="70" y="31" font-size="19" font-weight="700" fill="#0f172a">供水泵房</text>
      <text x="70" y="55" font-size="13" fill="#64748b">加压输送</text>
    </g>
  </g>
</svg>
